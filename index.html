<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%VITE_APP_LOGO%" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0 minimum-scale=1.0 maximum-scale=1.0"
    />
    <title>%VITE_APP_TITLE%</title>
    <meta name="description" content="%VITE_APP_DESCRIPTION%" />

    <style>
      .launch {
        position: fixed;
        inset-block-start: 0;
        inset-inline-start: 0;
        width: 100vw;
        height: 100vh;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
      }
      .dark .launch {
        background-color: #141414;
      }

      .launch-title {
        margin-block-start: 48px;
        font-size: 30px;
        font-weight: bold;
        color: rgba(0, 0, 0, 0.88);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial,
          'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol',
          'Noto Color Emoji';
      }
      .dark .launch-title {
        color: rgba(255, 255, 255, 0.85);
      }

      .launch-loader {
        width: 48px;
        height: 48px;
        display: inline-block;
        position: relative;
        background: #1677ff;
        box-sizing: border-box;
        animation: flipX 1s linear infinite;
      }

      @keyframes flipX {
        0% {
          transform: perspective(200px) rotateX(0deg) rotateY(0deg);
        }
        50% {
          transform: perspective(200px) rotateX(-180deg) rotateY(0deg);
        }
        100% {
          transform: perspective(200px) rotateX(-180deg) rotateY(-180deg);
        }
      }
    </style>
    <script>
      (() => {
        const colorScheme = localStorage.getItem('Cosey:colorScheme') || 'auto';

        const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (colorScheme === 'auto' ? isDark : colorScheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <script>
      var _hmt = _hmt || [];
      (function () {
        var hm = document.createElement('script');
        hm.src = 'https://hm.baidu.com/hm.js?4627db0d6c1c342772ef776c18ff7ca3';
        var s = document.getElementsByTagName('script')[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="launch">
      <div class="launch-loader"></div>
      <div class="launch-title">%VITE_APP_TITLE%</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
